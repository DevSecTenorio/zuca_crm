services:
  postgres:
    image: postgres:15
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_pass
      POSTGRES_DB: crm_dev
    ports:
      - '5432:5432'
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm_user -d crm_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: crm_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - crm_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crm_postgres_data:
  crm_redis_data:
